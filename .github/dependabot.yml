version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    cooldown:
      default-days: 30
      semver-minor-days: 60
      semver-major-days: 90
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 30
      semver-minor-days: 60
      semver-major-days: 90

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 30
      semver-minor-days: 60
      semver-major-days: 90
